{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "extension.fullname" . }}
  labels:
    {{- include "extension.labels" . | nindent 4 }}
rules:
- apiGroups:
    - "coordination.k8s.io"
  resources:
    - leases
  verbs:
    - '*'
- apiGroups:
    - ""
  resources:
    - namespaces
  verbs:
    - get
    - list
    - watch
- apiGroups:
    - ""
  resources:
    - events
  verbs:
    - create
    - update
- apiGroups:
    - "cluster.kubesphere.io"
  resources:
    - clusters
  verbs:
    - get
    - list
    - watch
- apiGroups:
    - "kubesphere.io"
  resources:
    - extensions
  verbs:
    - get
    - list
    - watch
- apiGroups:
  - monitoring.coreos.com
  resources:
  - prometheusrules
  verbs:
  - '*'
- apiGroups:
  - alerting.kubesphere.io
  resources:
  - rulegroups
  - clusterrulegroups
  - globalrulegroups
  verbs:
  - '*'
{{- end }}