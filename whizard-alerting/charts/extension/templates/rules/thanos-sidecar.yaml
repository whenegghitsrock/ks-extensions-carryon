Do not change in-place! In order to change this file first read following link:
https://github.com/WhizardTelemetry/WhizardAlerting/tree/main/charts/whizard-alerting/hack
*/ -}}
{{- define "whizard-alerting.builtinRules.groups.thanos-sidecar.tmpl" }}

{{- $sidecarTargetNamespace := .Values.builtinRules.prometheusStackTarget.namespace }}
apiVersion: alerting.kubesphere.io/v2beta1
kind: GlobalRuleGroup
metadata:
  {{- if .Values.builtinRules.heritageNameOverride }}
  name: thanos-sidecar
  {{- else }}
  name: {{ printf "%s-%s" (include "extension.fullname" .) "thanos-sidecar" | trunc 63 | trimSuffix "-" }}
  {{- end }}
  labels:
    alerting.kubesphere.io/builtin: "true"
    alerting.kubesphere.io/enable: "true"
{{- if .Values.builtinRules.labels }}
{{ toYaml .Values.builtinRules.labels | indent 4 }}
{{- end }}
  annotations:
{{- if .Values.builtinRules.annotations }}
{{ toYaml .Values.builtinRules.annotations | indent 4 }}
{{- end }}
spec:
  rules:
{{- if not (.Values.builtinRules.disabled.ThanosSidecarBucketOperationsFailed | default false) }}
  - alert: ThanosSidecarBucketOperationsFailed
    annotations:
{{- if .Values.builtinRules.additionalRuleAnnotations }}
{{ toYaml .Values.builtinRules.additionalRuleAnnotations | indent 6 }}
{{- end }}
      description: Thanos Sidecar {{`{{`}}$labels.instance{{`}}`}} in {{`{{`}}$labels.cluster{{`}}`}}/{{`{{`}}$labels.namespace{{`}}`}} bucket operations are failing
      runbook_url: {{ trimAll "/" .Values.builtinRules.runbookUrl }}/thanos/thanossidecarbucketoperationsfailed
      summary: Thanos Sidecar bucket operations are failing
    expr: sum by (cluster, namespace, job, instance) (rate(thanos_objstore_bucket_operation_failures_total{job=~".*(thanos-sidecar|sidecar-whizard).*", namespace="{{ $sidecarTargetNamespace }}"}[5m])) > 0
    for: 5m
    id: ef060d3b3f8f5f3b5ae4283837b39e43
    labels:
{{- if .Values.builtinRules.additionalRuleLabels }}
{{ toYaml .Values.builtinRules.additionalRuleLabels | indent 6 }}
{{- end }}
    severity: critical
{{- end }}
{{- if not (.Values.builtinRules.disabled.ThanosSidecarNoConnectionToStartedPrometheus | default false) }}
  - alert: ThanosSidecarNoConnectionToStartedPrometheus
    annotations:
{{- if .Values.builtinRules.additionalRuleAnnotations }}
{{ toYaml .Values.builtinRules.additionalRuleAnnotations | indent 6 }}
{{- end }}
      description: Thanos Sidecar {{`{{`}}$labels.instance{{`}}`}} in {{`{{`}}$labels.cluster{{`}}`}}/{{`{{`}}$labels.namespace{{`}}`}} is unhealthy.
      runbook_url: {{ trimAll "/" .Values.builtinRules.runbookUrl }}/thanos/thanossidecarnoconnectiontostartedprometheus
      summary: Thanos Sidecar cannot access Prometheus, even though Prometheus seems healthy and has reloaded WAL.
    expr: |-
      thanos_sidecar_prometheus_up{job=~".*(thanos-sidecar|sidecar-whizard).*", namespace="{{ $sidecarTargetNamespace }}"} == 0
      AND on (namespace, pod)
      prometheus_tsdb_data_replay_duration_seconds != 0
    for: 5m
    id: 3111c1b26eed6a090d55ae6d914bf640
    labels:
{{- if .Values.builtinRules.additionalRuleLabels }}
{{ toYaml .Values.builtinRules.additionalRuleLabels | indent 6 }}
{{- end }}
    severity: critical
{{- end }}
{{- end }}