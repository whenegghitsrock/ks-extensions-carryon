datadog_agent:

To forward logs from Datadog Agents deployed with the "datadog" Helm chart,
include the following in the "values.yaml" for your "datadog" chart:

For Datadog Agents version "7.34"/"6.34" or lower:

datadog:
  containerExclude: "name:vector"
  logs:
    enabled: true
    containerCollectAll: true
agents:
  useConfigMap: true
  customAgentConfig:
    kubelet_tls_verify: false
    logs_config:
      logs_dd_url: "xxx-vector.xxx:8282"
      logs_no_ssl: true
      use_http: true

For Datadog Agents version "7.35"/"6.35" or greater:

datadog:
  containerExclude: "name:vector"
  logs:
    enabled: true
    containerCollectAll: true
agents:
  useConfigMap: true
  customAgentConfig:
    kubelet_tls_verify: false
    vector:
      logs:
        enabled: true
        url: "http://xxx-vector.xxx:8282"
      metrics:
        enabled: true
        url: "http://xxx-vector.xxx:8282"
